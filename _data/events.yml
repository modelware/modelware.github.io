# Events listed on /events/. `date` (the first day) orders the list and decides
# upcoming versus past; `when` is what the page shows. `url` is the event's own page:
# a page under /events/ for events we host, the news item for the rest, or the
# openCAESAR page for the forums held before this site listed events. `draft: true` keeps
# an event off every listing until it is announced.
#
# An upcoming event can also give `time`, `venue` and `venue_detail`, `admission`, `art`
# (a wide image with no text, shown behind the date), and `register` (the sign-up link);
# the featured card on /events/ falls back to `location` and `image` without them.

- title: "onto:Nexus Forum 2027"
