{% comment %} Homepage pointer to /customers/: one card, the stories themselves live on that page. {% endcomment %}
<style>
    .home-stories { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 32px; padding: 34px 40px; border: 1px solid rgba(16, 26, 46, 0.08); border-top: 3px solid #0fb9a8; border-radius: 16px; background: linear-gradient(160deg, #ffffff 0%, #f2f7fb 100%); box-shadow: 0 16px 36px rgba(16, 26, 46, 0.08); }
    .home-stories .text { flex: 1 1 480px; }
    .home-stories h3 { margin: 6px 0 8px; color: #16233c; }
    .home-stories p { margin: 0; color: #5d6b7e; }
    @media (max-width: 767px) { .home-stories { padding: 26px 22px; } }
</style>
<section class="section home-platform">
    <div class="container">
        <div class="home-stories">
            <div class="text">
                <span class="eyebrow">Customer Stories</span>
                <h3>Proven in Practice</h3>
                <p>See how engineering organizations use Modelware products to bring rigor, automation, and agility to how they engineer.</p>
            </div>
            <a href="{{ '/customers/' | relative_url }}" class="btn btn-primary">Read Customer Stories</a>
        </div>
    </div>
</section>
