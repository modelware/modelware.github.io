<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="An engineer states intent to a neural AI, which proposes changes to a formal engineering model; a symbolic reasoner derives and verifies. Reasoning results inform the next AI proposal, and engineering judgment steers the whole loop.">
  <defs>
    <linearGradient id="q-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="0.78" stop-color="#0a1322"/>
    </linearGradient>
    <radialGradient id="q-glow-l" cx="0.16" cy="0.5" r="0.46">
      <stop offset="0" stop-color="#0fb9a8" stop-opacity="0.17"/>
      <stop offset="0.75" stop-color="#0fb9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="q-glow-r" cx="0.84" cy="0.5" r="0.46">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.19"/>
      <stop offset="0.75" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <marker id="q-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2de0c8"/>
    </marker>
    <marker id="q-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="q-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f8ca3"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#q-bg)"/>
  <rect width="800" height="500" fill="url(#q-glow-l)"/>
  <rect width="800" height="500" fill="url(#q-glow-r)"/>

  <!-- ===== top rail: reasoning informs the next proposal ===== -->
  <path d="M690 100 C 738 100, 748 72, 700 60 L 176 60 C 128 60, 120 86, 158 100"
        stroke="#2de0c8" stroke-width="1.6" fill="none" opacity="0.75" marker-end="url(#q-t)"/>
  <rect x="284" y="48" width="232" height="24" rx="12" fill="#0d1728" stroke="#2b6f6a" stroke-width="1.1"/>
  <text x="400" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8fded1">AI proposals informed by reasoning</text>

  <!-- ===== Engineer ===== -->
  <rect x="26" y="112" width="164" height="248" rx="14" fill="#101b2f" stroke="#2b6f6a" stroke-width="1.6"/>
  <g transform="translate(108,148)" stroke="#5eead4" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-6" r="8"/>
    <path d="M-13 16 C -13 4, -6 2, 0 2 C 6 2, 13 4, 13 16"/>
  </g>
  <text x="108" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Engineer</text>
  <text x="108" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5eead4">Intent and judgment</text>
  <path d="M62 224 H154" stroke="#2b6f6a" stroke-width="1.2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#b9c4d6">
    <text x="44" y="248">States intent</text>
    <text x="44" y="268">Asks questions</text>
    <text x="44" y="288">Brings expertise</text>
    <text x="44" y="308">Reviews and decides</text>
    <text x="44" y="328">Guides the work</text>
  </g>

  <!-- ===== Neural AI ===== -->
  <rect x="212" y="112" width="164" height="248" rx="14" fill="#101b2f" stroke="#3c5a8a" stroke-width="1.6"/>
  <g transform="translate(294,148)" stroke="#6ea8ff" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M-3 -14 C -12 -14, -16 -7, -13 -2 C -18 2, -15 12, -6 12 L -3 12 Z"/>
    <path d="M3 -14 C 12 -14, 16 -7, 13 -2 C 18 2, 15 12, 6 12 L 3 12 Z"/>
    <path d="M0 -14 V 12"/>
  </g>
  <text x="294" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Neural AI</text>
  <text x="294" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6ea8ff">Interpret and propose</text>
  <path d="M248 224 H340" stroke="#3c5a8a" stroke-width="1.2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#b9c4d6">
    <text x="230" y="248">Understands intent</text>
    <text x="230" y="268">Proposes changes</text>
    <text x="230" y="288">Answers questions</text>
    <text x="230" y="308">Explains results</text>
    <text x="230" y="328">Refines on feedback</text>
  </g>

  <!-- ===== Formal model ===== -->
  <rect x="398" y="112" width="164" height="248" rx="14" fill="#101b2f" stroke="#4a5f83" stroke-width="1.6"/>
  <g transform="translate(480,148)" stroke="#9db4d8" stroke-width="1.8" fill="none">
    <path d="M-14 -8 L 0 -15 L 14 -8 L 0 -1 Z"/>
    <path d="M-14 0 L 0 7 L 14 0"/>
    <path d="M-14 8 L 0 15 L 14 8"/>
  </g>
  <text x="480" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Formal Model</text>
  <text x="480" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9db4d8">Authoritative knowledge</text>
  <path d="M434 224 H526" stroke="#4a5f83" stroke-width="1.2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#b9c4d6">
    <text x="416" y="248">Explicit semantics</text>
    <text x="416" y="268">Integrated knowledge</text>
    <text x="416" y="288">Requirements and</text>
    <text x="416" y="304">interfaces</text>
    <text x="416" y="328">Living representation</text>
  </g>

  <!-- ===== Symbolic reasoner ===== -->
  <rect x="584" y="112" width="164" height="248" rx="14" fill="#151233" stroke="#6d4fc4" stroke-width="1.6"/>
  <g transform="translate(666,148)" stroke="#a78bfa" stroke-width="1.8" fill="none">
    <path d="M0 -15 L 14 0 L 0 15 L -14 0 Z"/>
    <circle cx="0" cy="-15" r="3.4" fill="#a78bfa"/>
    <circle cx="14" cy="0" r="3.4" fill="#a78bfa"/>
    <circle cx="0" cy="15" r="3.4" fill="#a78bfa"/>
    <circle cx="-14" cy="0" r="3.4" fill="#a78bfa"/>
  </g>
  <text x="666" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">Symbolic Reasoner</text>
  <text x="666" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c4b5fd">Derive and verify</text>
  <path d="M620 224 H712" stroke="#6d4fc4" stroke-width="1.2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#b9c4d6">
    <text x="602" y="248">Derives new facts</text>
    <text x="602" y="268">Checks consistency</text>
    <text x="602" y="288">Evaluates rules</text>
    <text x="602" y="308">Identifies conflicts</text>
    <text x="602" y="328">Explains why</text>
  </g>

  <!-- ===== flows between the participants ===== -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#8f9db4">
    <path d="M190 172 H206" stroke="#2de0c8" stroke-width="1.5" fill="none" marker-end="url(#q-t)"/>
    <text x="198" y="162" text-anchor="middle">natural language</text>
    <path d="M206 296 H190" stroke="#7f8ca3" stroke-width="1.3" fill="none" marker-end="url(#q-d)"/>
    <text x="198" y="312" text-anchor="middle">explanations</text>

    <path d="M376 172 H392" stroke="#2de0c8" stroke-width="1.5" fill="none" marker-end="url(#q-t)"/>
    <text x="384" y="162" text-anchor="middle">model operations</text>
    <path d="M392 296 H376" stroke="#7f8ca3" stroke-width="1.3" fill="none" marker-end="url(#q-d)"/>
    <text x="384" y="312" text-anchor="middle">model context</text>

    <path d="M562 172 H578" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#q-p)"/>
    <text x="570" y="162" text-anchor="middle">queries, changes</text>
    <path d="M578 296 H562" stroke="#7f8ca3" stroke-width="1.3" fill="none" marker-end="url(#q-d)"/>
    <text x="570" y="312" text-anchor="middle">entailments</text>
  </g>

  <!-- ===== bottom rail: judgment steers the loop ===== -->
  <path d="M108 364 C 108 388, 120 402, 176 402 L 700 402 C 750 402, 752 380, 716 366"
        stroke="#5eead4" stroke-width="1.6" fill="none" opacity="0.7" marker-end="url(#q-t)"/>
  <rect x="294" y="390" width="212" height="24" rx="12" fill="#0d1728" stroke="#2b6f6a" stroke-width="1.1"/>
  <text x="400" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8fded1">Engineering judgment steers the loop</text>

  <!-- ===== caption ===== -->
  <text x="400" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#dbe3ef">Natural interaction. Formal knowledge. Verified results.</text>
  <text x="400" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7f8ca3">the assistant proposes, the reasoner grounds, the engineer decides</text>
</svg>
