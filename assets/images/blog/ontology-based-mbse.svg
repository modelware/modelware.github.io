<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Engineering knowledge moving from documents, to a tool-centric system model, to an ontology-based knowledge graph that a reasoner can check">
  <defs>
    <linearGradient id="ob-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="0.8" stop-color="#0a1322"/>
    </linearGradient>
    <radialGradient id="ob-glow-m" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ob-glow-r" cx="0.84" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#0fb9a8" stop-opacity="0.24"/>
      <stop offset="0.7" stop-color="#0fb9a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="ob-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ob-bg)"/>
  <rect width="800" height="500" fill="url(#ob-glow-m)"/>
  <rect width="800" height="500" fill="url(#ob-glow-r)"/>

  <text x="62" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#7f8ca3">DOCUMENTS</text>
  <text x="330" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#a78bfa">MODELS</text>
  <text x="590" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#6ee7db">ONTOLOGIES</text>

  <!-- left: a stack of documents -->
  <g fill="#1d2a44" stroke="#46597a" stroke-width="1.5">
    <rect x="92" y="176" width="112" height="146" rx="6"/>
    <rect x="80" y="188" width="112" height="146" rx="6"/>
    <rect x="68" y="200" width="112" height="146" rx="6"/>
  </g>
  <g stroke="#46597a" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M86 228 H160 M86 246 H152 M86 264 H162 M86 282 H140 M86 300 H156 M86 318 H130"/>
  </g>

  <!-- arrow -->
  <g stroke="#46597a" stroke-width="1.5" stroke-dasharray="3 5" fill="none">
    <path d="M226 262 H290"/>
  </g>

  <!-- middle: a tool-centric decomposition -->
  <g stroke="#5a6ea8" stroke-width="1.5" opacity="0.8" fill="none">
    <path d="M370 176 L322 252 M370 176 L418 252 M322 252 L300 334 M322 252 L344 334 M418 252 L396 334 M418 252 L440 334"/>
  </g>
  <g fill="#8b5cf6" opacity="0.9">
    <rect x="358" y="164" width="24" height="24" rx="5"/>
    <rect x="310" y="240" width="24" height="24" rx="5"/><rect x="406" y="240" width="24" height="24" rx="5"/>
    <rect x="290" y="324" width="20" height="20" rx="4"/><rect x="334" y="324" width="20" height="20" rx="4"/>
    <rect x="386" y="324" width="20" height="20" rx="4"/><rect x="430" y="324" width="20" height="20" rx="4"/>
  </g>

  <!-- arrow -->
  <g stroke="#46597a" stroke-width="1.5" stroke-dasharray="3 5" fill="none">
    <path d="M478 262 H542"/>
  </g>

  <!-- right: a knowledge graph with typed, inferred links -->
  <g stroke="#2f8f86" stroke-width="1.6" opacity="0.85" fill="none">
    <path d="M600 190 L668 170 M600 190 L588 272 M668 170 L716 240 M588 272 L660 262 M660 262 L716 240 M660 262 L628 342 M716 240 L740 322 M628 342 L740 322"/>
  </g>
  <g stroke="#6ee7db" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.8" fill="none">
    <path d="M600 190 L660 262 M588 272 L628 342"/>
  </g>
  <g fill="#0fb9a8" filter="url(#ob-soft)">
    <circle cx="600" cy="190" r="9"/><circle cx="668" cy="170" r="7"/><circle cx="588" cy="272" r="7"/>
    <circle cx="660" cy="262" r="11"/><circle cx="716" cy="240" r="8"/><circle cx="628" cy="342" r="7"/>
    <circle cx="740" cy="322" r="7"/>
  </g>

  <!-- reasoner check -->
  <g transform="translate(700 400)">
    <path d="M0 -26 L22.5 -13 L22.5 13 L0 26 L-22.5 13 L-22.5 -13 Z" fill="#0f1c2e" stroke="#6ee7db" stroke-width="2" filter="url(#ob-soft)"/>
    <path d="M-9 1 L-2 8 L10 -6" fill="none" stroke="#6ee7db" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="592" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5" fill="#6ee7db">REASONED</text>
</svg>
